# esp32-webasto36 on the external component components/diesel_heater.
# Same MQTT topics as esp32-webasto36.yaml. esp32-webasto36.yaml is the
# old firmware (custom_component, heater.h, ESPHome 2024.12 only). This
# file builds on newer ESPHome.
# identify emitter,base, collector on transistor https://www.youtube.com/watch?v=W5yfAZoE5sY
# mosquitto_sub -h <broker> -t "esp32-webasto36/#" -v
packages:
  utility: !include package-utility.yaml

substitutions:
  device: esp32-webasto36

esp32: 
 board: esp32dev # esp32-wroom-32
 # Less average current. The ESP takes its power from the heater panel's
 # weak 5 V line. Read README-chinbasto.md, step 8.
 cpu_frequency: 80MHZ
 # board: esp32-s3-devkitc-1 some big mem type
 # framework:
 #    type: arduino # esp-idf
 #    version: recommended

esphome:
  name: ${device}

external_components:
  # Local copy in this repo. A deployment pins one commit instead:
  #   type: git, url: https://github.com/PabloVitasso/esphome-chinbasto,
  #   ref: <commit>. Move the pin on purpose, never to a branch.
  - source:
      type: local
      path: components
    components: [diesel_heater]

#### BLE remove 
# esp32_ble_tracker:

# api:
#   password: somepassword
#   reboot_timeout: 0s
  
# - platform: safe_mode
#   name: "Safe Mode"

wifi:
  reboot_timeout: 0s
  power_save_mode: LIGHT   # "none" ble tracker incompatible
  # Smaller transmit peaks, for the same weak supply. The router is close.
  output_power: 8.5dB
  fast_connect: false # set true for hidden essid. does not work for multiple networks
  use_address: !secret static_ip
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    manual_ip:
      static_ip: !secret static_ip
      gateway: !secret gateway
      subnet: !secret subnet
    #   dns1: 9.9.9.9

mqtt:
  reboot_timeout: 0s # do not restart when no connection to mqtt
  keepalive: 30s # default 15s (seconds)
  broker: !secret mqtt_broker
  topic_prefix: null
  # disable all HA-centric device discovery stuff
  discovery: false 
  discover_ip: false
  discovery_retain: false
  birth_message:
    topic: ${device}/status
    payload: online
  will_message:
    topic: ${device}/status
    payload: offline
  shutdown_message:
    topic: ${device}/status
    payload: offline
  log_topic:
    topic: "doesnotmatter" # literally does not matter because log level is NONE
    level: NONE
  on_message:
    - topic:  ${device}/chinbasto/set_on
      qos: 0
      then:
      - button.press: button_on
    - topic:  ${device}/chinbasto/set_off
      qos: 0
      then:
      - button.press: button_off
    # EXPERIMENTAL. Serial ON and OFF over the blue wire. Serial ON
    # proven 2026-11-12, serial OFF not tested. Node-RED does not use these topics. The two topics
    # above stay the standard control path.
    - topic:  ${device}/chinbasto/experimental/serial_on
      qos: 0
      then:
      - button.press: button_serial_on
    - topic:  ${device}/chinbasto/experimental/serial_off
      qos: 0
      then:
      - button.press: button_serial_off

uart:
  # 25000 baud is about 2.5 bytes per ms. 256, the default, holds about
  # 100 ms. At 80 MHz a slow loop is likelier, so hold about 400 ms.
  rx_buffer_size: 1024
  # RX and TX share the blue wire on GPIO21. TX is open-drain: it only
  # pulls the line low and never drives it high, so it cannot fight the
  # panel. The component transmits only when a serial command is
  # requested, and nothing requests one unless an experimental button is
  # pressed.
  rx_pin:
    number: GPIO21
    allow_other_uses: true
  tx_pin:
    number: GPIO21
    mode:
      output: true
      open_drain: true
    allow_other_uses: true
  baud_rate: 25000
  data_bits: 8 # default 8
  parity: NONE # detault NONE
  stop_bits: 1 # default 1
  id: heater_serial


logger:
  level: NONE
  # baud_rate: 0 # 0: disable UART logging to USB

web_server:
  port: 80
  local: true # No internet/intranet required on the clients (all assets are inlined, compressed and served from flash)
  version: 3
  ota: false
  css_url: ""
  js_url: ""
ota:
  password: !secret ota_password

button: 
  # Restart button comes from package-utility.yaml. A second copy is a
  # hard error in ESPHome 2026.10 (duplicate entity name).
  # - platform: restart
  #   name: "${device} restart"

  - platform: template
    name: "Power ON (smart)"
    id: button_on
    on_press:
      then:
        - switch.turn_on: chinbasto_power
        - delay: 1s
        - logger.log: "button: trying to put chinbasto ON"
        - switch.turn_off: chinbasto_power

  - platform: template
    name: "Power OFF (smart)"
    id: button_off
    on_press:
      then:
        - switch.turn_on: chinbasto_power
        - delay: 3s
        - logger.log: "button: trying to put chinbasto OFF (long press)"
        - switch.turn_off: chinbasto_power

  # EXPERIMENTAL. Serial ON and OFF over the blue wire. The component
  # copies the controller's last frame, sets the command byte and the
  # CRC, and sends it right after the next valid exchange. Serial ON
  # proven on this heater 2026-11-12; serial OFF not tested. Check
  # state_code and the bad_* counters in the debug JSON after each press.
  - platform: template
    name: "Experimental: Serial ON"
    id: button_serial_on
    on_press:
      - lambda: id(heater).request_on();

  - platform: template
    name: "Experimental: Serial OFF"
    id: button_serial_off
    on_press:
      - lambda: id(heater).request_off();

# https://esphome.io/components/switch/index.html
switch:
  # Debug data on or off. Off after every boot, so a forgotten switch
  # cannot keep the traffic high.
  - platform: template
    name: "Debug data"
    id: heater_debug_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(heater).set_debug(true);
    turn_off_action:
      - lambda: id(heater).set_debug(false);

  - platform: gpio
    name: "Power (debug: switches transistor in the button)"
    internal: false
    id: chinbasto_power
    pin: GPIO13
    inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
    - logger.log: "Switch Turned On!"
    on_turn_off:
    - logger.log: "Switch Turned Off!"
  
sensor:
# The component decides when each value goes out. Read its
# publish_policy.h. Discrete values: on change, and every 5 min.
# Measurements: one 60 s window. Debug data: one JSON text, only while
# the "Debug data" switch is on. So no filters here.
#   - platform: xiaomi_lywsd03mmc
#     id: "temp01"
#     mac_address: "REDACTED"
#     bindkey: "REDACTED"
#     temperature:
#       name: "04 Front X Temp"
#       id: "temp01temp"
#       state_topic: ${device}/xiaomi/front/temperature
#     humidity:
#       name: "05 Front X Humidity"
#       id: "temp01humid"
#       state_topic: ${device}/xiaomi/front/humidity
#     battery_level:
#       name: "05b Front X Battery Level"
#       id: "temp01batlevel"
#       state_topic: ${device}/xiaomi/front/batlevel
#
#   - platform: xiaomi_lywsd03mmc
#     mac_address: "REDACTED"
#     bindkey: "REDACTED"
#     temperature:
#       name: "07 Back X Temp"
#       id: "temp02temp"
#       state_topic: ${device}/xiaomi/back/temperature
#     humidity:
#       name: "08 Back X Humidity"
#       id: "temp02humid"
#       state_topic: ${device}/xiaomi/back/humidity
#     battery_level:
#       name: "08b Back X Battery Level"
#       id: "temp02batlevel"
#       state_topic: ${device}/xiaomi/back/batlevel

  - platform: template
    name: "Chamber Temperature"
    id: chamber_temperature
    state_topic: ${device}/chinbasto/chamber_temperature
    icon: mdi:fire
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Chamber Temperature Max (1 min)"
    id: chamber_temperature_max
    state_topic: ${device}/chinbasto/chamber_temperature_max
    icon: mdi:fire
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Pump Frequency"
    id: pump_frequency
    state_topic: ${device}/chinbasto/pump_frequency
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Fan Speed (1 min mean)"
    id: fan_speed
    state_topic: ${device}/chinbasto/fan_speed
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Temperature mode: Set Temperature"
    id: temperature
    state_topic: ${device}/chinbasto/temperature
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Is On or Off"
    id: mode
    state_topic: ${device}/chinbasto/is_on_or_off
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "State (code)"
    id: state_int
    state_topic: ${device}/chinbasto/state_code
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Error (Code)"
    id: error_int
    state_topic: ${device}/chinbasto/error_code
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Active Error (Code)"
    id: active_error_int
    state_topic: ${device}/chinbasto/active_error_code
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Link (1 = frames arriving)"
    id: heater_link
    state_topic: ${device}/chinbasto/diag/link
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: status_description
    name: "Status Description"
    state_topic: ${device}/chinbasto/status_description
    update_interval: never

  - platform: template
    id: error_description
    name: "Error Description"
    state_topic: ${device}/chinbasto/error_description
    update_interval: never

  # One JSON message per update while "Debug data" is on: counters, duty,
  # raw protocol fields, the last exchange as hex.
  - platform: template
    id: heater_debug_data
    name: "Debug Data (JSON)"
    state_topic: ${device}/chinbasto/debug
    update_interval: never

diesel_heater:
  id: heater
  uart_id: heater_serial
  update_interval: 15s
  state: state_int
  on_off: mode
  error: error_int
  active_error: active_error_int
  set_temperature: temperature
  link: heater_link
  pump_frequency: pump_frequency
  fan_speed: fan_speed
  chamber_temperature: chamber_temperature
  chamber_temperature_max: chamber_temperature_max
  state_text: status_description
  error_text: error_description
  debug_data: heater_debug_data
  dump_packets: false
